name: validation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [daemon/tests, gui/tests, cli, packaging]
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pytest python3-yaml python3-gi python3-gi-cairo gir1.2-glib-2.0 gir1.2-gtk-4.0 gir1.2-adw-1
      - name: One suite per process; no hardware tests
        env:
          SUITE: ${{ matrix.suite }}
        run: python3 -m pytest "$SUITE" -q -m 'not hardware'
