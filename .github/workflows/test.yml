name: test

# Every pull request and every push to master. pull_request, never
# pull_request_target: a pull request from a fork then runs with a read-only
# token and no secrets, which is all that code nobody has reviewed yet should get.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. A push to
# master is never cancelled (run_id is unique to each run), so every commit on
# master gets a full result.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned like release.yml: the package targets noble, so a green run should
    # mean noble's python3, pytest and GTK, on the runner the release is built on.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes or fetches, so the code under test does not get
          # even the read-only token.
          persist-credentials: false

      - name: Install test dependencies
        id: deps
        run: |
          sudo apt-get update
          # The distribution's own packages, as the .deb uses them. python3-pytest
          # runs the suites; packaging/ also needs python3-yaml (it parses
          # release.yml), dpkg-dev (dpkg-parsechangelog) and groff-base (it
          # checks the man pages).
          sudo apt-get install -y --no-install-recommends \
            python3-pytest python3-yaml dpkg-dev groff-base \
            python3-gi python3-gi-cairo gir1.2-glib-2.0 gir1.2-gtk-4.0 \
            gir1.2-adw-1 dbus desktop-file-utils

      # One pytest invocation per suite. Each suite keeps its helpers in a
      # top-level conftest.py, so a shared run imports only one of them as the
      # module `conftest` and the other suite fails to collect.
      #
      # !cancelled() runs every check even after one has failed, so a single run
      # shows all the problems. A first pull request may have to wait for the
      # maintainer to approve its run; one round should be enough.
      - name: Packaging suite
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python3 -m pytest packaging -q

      - name: CLI suite
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python3 -m pytest cli -q

      - name: Daemon suite
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cd daemon && python3 -m pytest -q

      # No xvfb: the GUI suite tests the app's logic and never opens a window.
      # It passes with DISPLAY and WAYLAND_DISPLAY unset.
      - name: GUI suite
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cd gui && python3 -m pytest -q

      - name: Tools suite, once tools/ exists
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          # tools/ is not on master yet. The guard lets this workflow run
          # unchanged before and after it lands.
          if [ -d tools ]; then
            python3 -m pytest tools -q
          else
            echo "No tools/ directory, so nothing to run."
          fi

      - name: Validate the desktop entries
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: desktop-file-validate gui/data/*.desktop

      - name: Check shell syntax
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          # One file per bash -n: `bash -n a b` checks only a, and passes b to
          # it as $1.
          for f in gfan gkbd gigactl-cli-lib.sh install.sh; do
            bash -n "$f"
          done
