# The daemon's Embedded Controller backend is the ec_sys debugfs file,
# where the kernel's own EC driver performs and serialises each transaction.
# Its absence is fatal by design: the daemon fails closed rather than falling
# back to raw /dev/port access, which races the kernel driver and needs an
# explicit administrator opt-in. Load the module at boot.
# Write support comes from modprobe.d/gigactl.conf.
ec_sys
